<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>地球風場3D - Professional Weather Engine</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #controlPanel {
            position: absolute; top: 20px; left: 20px; width: 330px; max-height: 90vh;
            background: rgba(10, 10, 14, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 22px; border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            color: #e4e4e7; z-index: 1000; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08); overflow-y: auto;
        }
        h3 { margin-top: 0; font-size: 16px; font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px; color: #fff; letter-spacing: 0.3px; }
        .control-group { margin-bottom: 18px; }
        .control-group label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; color: #a1a1aa; margin-bottom: 6px; letter-spacing: 0.8px; }
        select { width: 100%; background: #1f1f23; color: #fff; border: 1px solid #2d2d34; padding: 10px 12px; border-radius: 7px; font-size: 13px; cursor: pointer; outline: none; }
        input[type="range"] { width: 100%; background: #2d2d34; height: 6px; border-radius: 3px; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #0a84ff; cursor: pointer; }
        .toggle-container { border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 14px; margin-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
        .toggle-container label { cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .toggle-container input[type="checkbox"] { width: 16px; height: 16px; accent-color: #0a84ff; cursor: pointer; }
        #legend { position: absolute; bottom: 30px; right: 30px; background: rgba(10, 10, 14, 0.85); padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); font-family: monospace; font-size: 11px; color: #fff; z-index: 1000; pointer-events: none; display: none; }
        .valid-time-display { font-size: 11px; font-family: monospace; color: #34c759; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<div id="controlPanel">
    <h3>地球風場3D</h3>
    
    <div class="control-group">
        <label>Forecast Model Core</label>
        <select id="modelSelect" onchange="handleModelChange()">
            <option value="gfs">NCEP GFS (Global Forecast System)</option>
            <option value="ecmwf">ECMWF IFS (High-Resolution)</option>
            <option value="aifs">ECMWF AIFS (Artificial Intelligence)</option>
        </select>
    </div>

    <div class="control-group">
        <label>Atmospheric Level Boundary</label>
        <select id="levelSelect" onchange="updateWeatherLayers()">
            <option value="10m">10-Meter Surface Boundary Layer</option>
            <option value="850">850 hPa (~1,500 m)</option>
            <option value="700">700 hPa (~2,500 m)</option>
            <option value="500">500 hPa (~5,500 m)</option>
            <option value="200">200 hPa (~12,000 m)</option>
        </select>
    </div>

    <div class="control-group">
        <label>Forecast Timeline: +<span id="hourVal">000</span> Hours</label>
        <input type="range" id="timeSlider" min="0" max="30" value="0" step="1" oninput="handleSliderChange(this.value)">
        <span class="valid-time-display" id="validTimeVal">Valid: Calculating run operational baseline...</span>
    </div>

    <div class="control-group">
        <label>GIS Base Map Canvas</label>
        <select id="basemapSelect" onchange="changeBasemap(this.value)">
            <option value="dark">CartoDB Dark Matter</option>
            <option value="satellite">ArcGIS Satellite</option>
        </select>
    </div>

    <div class="toggle-container">
        <label><input type="checkbox" id="showCoastlines" checked onchange="updateWeatherLayers()"> WebGL-Wind Coastlines (Silver)</label>
        <label><input type="checkbox" id="showWindSpeed" onchange="updateWeatherLayers()"> NCAR Wind Speed Heatmap (0-120kt)</label>
        <label><input type="checkbox" id="showWindArrows" checked onchange="updateWeatherLayers()"> Large Movable Wind Arrows</label>
        <label><input type="checkbox" id="showIsobars" checked onchange="updateWeatherLayers()"> Pressure Isobars</label>
        <label><input type="checkbox" id="showPrecip" onchange="updateWeatherLayers()"> Forecast Precipitation Intensity</label>
        <hr style="width:100%; border:0; border-top:1px solid rgba(255,255,255,0.1); margin: 5px 0;">
        <label><input type="checkbox" id="realtimeRadar" onchange="toggleRealtimeRadar(this.checked)"> 📡 Live Weather Radar (RainViewer)</label>
        <label><input type="checkbox" id="h9Satellite" onchange="toggleH9Satellite(this.checked)"> Himawari-9 Band 13 (IR Satellite Live)</label>
    </div>
</div>

<div id="legend"></div>
<div id="cesiumContainer"></div>

<script>
    // Initialize Cesium Engine Sandbox
    const viewer = new Cesium.Viewer('cesiumContainer', {
        imageryProvider: false, baseLayerPicker: false, geocoder: false, homeButton: true,
        infoBox: false, navigationHelpButton: false, sceneModePicker: true, timeline: false, animation: false
    });

    // Generate Dynamic Weather Timeline Matrix Array
    const forecastHours = [];
    for (let h = 0; h <= 120; h += 6) { forecastHours.push(String(h).padStart(3, '0')); }
    for (let h = 132; h <= 240; h += 12) { forecastHours.push(String(h).padStart(3, '0')); }

    // Dynamic Binding configuration for Timeline Range Slider Boundaries
    const sliderInput = document.getElementById('timeSlider');
    sliderInput.min = "0";
    sliderInput.max = String(forecastHours.length - 1);

    let currentBaseLayer = null, h9SatelliteLayer = null, liveRadarLayer = null;
    let velocityTextureLayer = null, precipTextureLayer = null, combinedOutputLayer = null, arrowTextureLayer = null; 
    let activeDataset = null, activePrecipDataset = null;
    let webglWindCoastlineGeoJSON = null;
    let currentUpdateToken = 0; // Async race condition collision tracker

    // Asset Location Config (Using jsDelivr Wrapper for Tokenless Public CDN mirroring)
    const githubUser = "eknlau5897"; 
    const githubRepo = "Earth_windy_2.0";
    const cdnBase = `https://cdn.jsdelivr.net/gh/${githubUser}/${githubRepo}@main/data`;

    // Interactive Hover Data Label Display Card
    const trackingLabel = document.createElement('div');
    trackingLabel.style.cssText = `
        position: absolute; background: rgba(10, 10, 14, 0.92); padding: 10px 14px; border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: monospace; font-size: 12px; 
        pointer-events: none; display: none; z-index: 5000; box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    `;
    document.body.appendChild(trackingLabel);

    function calculateOperationalBaseTime(modelType) {
        const now = new Date();
        const utcFullYear = now.getUTCFullYear();
        const utcMonth = now.getUTCMonth();
        const utcDate = now.getUTCDate();
        const utcHours = now.getUTCHours();

        let runYear = utcFullYear, runMonth = utcMonth, runDay = utcDate, runHour = 0;

        if (modelType === 'ecmwf' || modelType === 'aifs') {
            if (utcHours >= 22) { runHour = 12; } 
            else if (utcHours >= 10) { runHour = 0; } 
            else {
                const yesterday = new Date(Date.UTC(utcFullYear, utcMonth, utcDate - 1));
                runYear = yesterday.getUTCFullYear(); runMonth = yesterday.getUTCMonth(); runDay = yesterday.getUTCDate();
                runHour = 12;
            }
        } else if (modelType === 'gfs') {
            if (utcHours >= 19) { runHour = 12; } 
            else if (utcHours >= 13) { runHour = 6; } 
            else if (utcHours >= 7) { runHour = 0; } 
            else if (utcHours >= 1) {
                const yesterday = new Date(Date.UTC(utcFullYear, utcMonth, utcDate - 1));
                runYear = yesterday.getUTCFullYear(); runMonth = yesterday.getUTCMonth(); runDay = yesterday.getUTCDate();
                runHour = 18;
            } else {
                const yesterday = new Date(Date.UTC(utcFullYear, utcMonth, utcDate - 1));
                runYear = yesterday.getUTCFullYear(); runMonth = yesterday.getUTCMonth(); runDay = yesterday.getUTCDate();
                runHour = 12;
            }
        }
        return new Date(Date.UTC(runYear, runMonth, runDay, runHour, 0, 0));
    }

    function updateValidTimeDisplay(modelType, addedHours) {
        const baseTime = calculateOperationalBaseTime(modelType);
        const runYearStr = baseTime.getUTCFullYear();
        const runMonthStr = String(baseTime.getUTCMonth() + 1).padStart(2, '0');
        const runDayStr = String(baseTime.getUTCDate()).padStart(2, '0');
        const runHourStr = String(baseTime.getUTCHours()).padStart(2, '0');
        
        const formattedDisplay = `${runYearStr}-${runMonthStr}-${runDayStr} ${runHourStr}Z +${addedHours}hr`;
        document.getElementById('validTimeVal').innerText = `Run: ${formattedDisplay}`;
        
        return { filenamePrefix: `${runYearStr}${runMonthStr}${runDayStr}`, runHour: runHourStr };
    }

    function handleModelChange() { updateWeatherLayers(); }

    function changeBasemap(type) {
        if (currentBaseLayer) { viewer.imageryLayers.remove(currentBaseLayer); }
        let url = type === 'dark' ? 'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png' : 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
        currentBaseLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({ url: url }));
        viewer.imageryLayers.lowerToBottom(currentBaseLayer);
    }

    function fetchWebGLWindCoastlines() {
        fetch('https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_coastline.geojson')
            .then(res => res.json())
            .then(data => {
                webglWindCoastlineGeoJSON = data;
                updateWeatherLayers(); 
            })
            .catch(err => console.error("Failed to load vector landmass topology:", err));
    }

    function drawWebGLWindCoastlines(ctx, width, height, header) {
        if (!document.getElementById('showCoastlines').checked || !webglWindCoastlineGeoJSON) return;

        ctx.save();
        ctx.lineWidth = 1.2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(240, 240, 245, 0.45)'; // Balanced tactical tint

        const { lo1, la1, lo2, la2 } = header;
        const lonRange = lo2 - lo1; const latRange = la1 - la2;

        for (let i = 0; i < webglWindCoastlineGeoJSON.features.length; i++) {
            const line = webglWindCoastlineGeoJSON.features[i].geometry.coordinates;
            let firstPoint = true; let lastX = null;

            ctx.beginPath();
            for (let j = 0; j < line.length; j++) {
                let lon = line[j][0]; let lat = line[j][1];

                if (lo1 >= 0 && lon < 0) lon += 360;
                if (lo1 < 0 && lon > 180) lon -= 360;

                const x = ((lon - lo1) / lonRange) * width;
                const y = ((la1 - lat) / latRange) * height;

                if (!firstPoint && lastX !== null && Math.abs(x - lastX) > width * 0.5) {
                    ctx.moveTo(x, y); 
                } else {
                    if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; } 
                    else { ctx.lineTo(x, y); }
                }
                lastX = x;
            }
            ctx.stroke();
        }
        ctx.restore();
    }

    function toggleRealtimeRadar(isVisible) {
        if (liveRadarLayer) { viewer.imageryLayers.remove(liveRadarLayer); liveRadarLayer = null; }
        if (!isVisible) return;

        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(res => res.json())
            .then(data => {
                if (data && data.radar && data.radar.past.length > 0) {
                    const latestPastFrame = data.radar.past[data.radar.past.length - 1];
                    const radarTileUrl = `${data.host}${latestPastFrame.path}/256/{z}/{x}/{y}/2/1_1.png`;
                    liveRadarLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
                        url: radarTileUrl, maximumLevel: 7
                    }));
                    enforceLayerOrdering();
                }
            })
            .catch(err => console.error("Error connecting to live radar feed:", err));
    }

    function toggleH9Satellite(isVisible) {
        if (h9SatelliteLayer) { viewer.imageryLayers.remove(h9SatelliteLayer); h9SatelliteLayer = null; }
        if (!isVisible) return;

        const dateObj = new Date();
        dateObj.setHours(dateObj.getHours() - 2); 
        const isoString = dateObj.toISOString(); 
        const ymd = isoString.split('T')[0];
        const hours = String(dateObj.getUTCHours()).padStart(2, '0');
        const minutes = String(Math.floor(dateObj.getUTCMinutes() / 10) * 10).padStart(2, '0');
        const timeString = `${hours}:${minutes}:00`;

        const gibsUrl = `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/Himawari9_AHI_Clean_Infrared_Band13/default/${ymd}T${timeString}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.png`;
        h9SatelliteLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
            url: gibsUrl, maximumLevel: 9
        }));
        enforceLayerOrdering();
    }

    function enforceLayerOrdering() {
        if (currentBaseLayer) viewer.imageryLayers.lowerToBottom(currentBaseLayer);
        if (velocityTextureLayer) viewer.imageryLayers.raiseToTop(velocityTextureLayer);
        if (precipTextureLayer) viewer.imageryLayers.raiseToTop(precipTextureLayer);
        if (h9SatelliteLayer) viewer.imageryLayers.raiseToTop(h9SatelliteLayer);
        if (liveRadarLayer) viewer.imageryLayers.raiseToTop(liveRadarLayer);
        if (arrowTextureLayer) viewer.imageryLayers.raiseToTop(arrowTextureLayer);
        if (combinedOutputLayer) viewer.imageryLayers.raiseToTop(combinedOutputLayer); 
    }

    function handleSliderChange(val) {
        const targetHour = forecastHours[val];
        document.getElementById('hourVal').innerText = targetHour;
        updateWeatherLayers();
    }

    // Core Binary Unpacking Data Parsing Engine
    function updateWeatherLayers() {
        const localToken = ++currentUpdateToken;

        if (velocityTextureLayer) { viewer.imageryLayers.remove(velocityTextureLayer); velocityTextureLayer = null; }
        if (precipTextureLayer) { viewer.imageryLayers.remove(precipTextureLayer); precipTextureLayer = null; }
        if (combinedOutputLayer) { viewer.imageryLayers.remove(combinedOutputLayer); combinedOutputLayer = null; }
        if (arrowTextureLayer) { viewer.imageryLayers.remove(arrowTextureLayer); arrowTextureLayer = null; }
        
        viewer.entities.removeAll();
        document.getElementById('legend').style.display = 'none';
        activeDataset = null; activePrecipDataset = null;

        const model = document.getElementById('modelSelect').value;
        const level = document.getElementById('levelSelect').value;
        const index = document.getElementById('timeSlider').value;
        const targetHour = forecastHours[index];

        const activeWindSpeed = document.getElementById('showWindSpeed').checked;
        const activeWindArrows = document.getElementById('showWindArrows').checked;
        const activeIsobars = document.getElementById('showIsobars').checked;
        const activePrecip = document.getElementById('showPrecip').checked;

        updateValidTimeDisplay(model, targetHour);

        // PIPELINE 1: FETCH, UNZIP, AND PARSE WIND ARRAYS
        if (activeWindSpeed || activeWindArrows || document.getElementById('showCoastlines').checked) {
            fetch(`${cdnBase}/${model}_${level}_f${targetHour}.json.gz`)
                .then(res => { if(!res.ok) throw new Error(); return res.arrayBuffer(); })
                .then(buf => {
                    if (localToken !== currentUpdateToken) return;
                    const byteArray = new Uint8Array(buf);
                    const decompressedText = pako.inflate(byteArray, { to: 'string' });
                    activeDataset = JSON.parse(decompressedText);
                    renderVelocityCanvasStack(activeDataset, activeWindSpeed, activeWindArrows);
                }).catch(err => console.log("Wind array omitted or file pending refresh"));
        }

        // PIPELINE 2: FETCH, UNZIP, AND PARSE PRECIPITATION MATRIX
        if (activePrecip) {
            fetch(`${cdnBase}/${model}_rain_f${targetHour}.json.gz`)
                .then(res => { if(!res.ok) throw new Error(); return res.arrayBuffer(); })
                .then(buf => {
                    if (localToken !== currentUpdateToken) return;
                    const byteArray = new Uint8Array(buf);
                    const decompressedText = pako.inflate(byteArray, { to: 'string' });
                    activePrecipDataset = JSON.parse(decompressedText);
                    renderPrecipitationTexture(activePrecipDataset);
                }).catch(err => console.log("Rain array omitted or file pending refresh"));
        }

        // PIPELINE 3: FETCH, UNZIP, AND PARSE CONTOUR ISOBARS
        if (activeIsobars) {
            fetch(`${cdnBase}/${model}_mslp_f${targetHour}.json.gz`)
                .then(res => { if(!res.ok) throw new Error(); return res.arrayBuffer(); })
                .then(buf => {
                    if (localToken !== currentUpdateToken) return;
                    const byteArray = new Uint8Array(buf);
                    const decompressedText = pako.inflate(byteArray, { to: 'string' });
                    renderIsobarContours(JSON.parse(decompressedText));
                }).catch(err => console.log("MSLP isobar omitted or file pending refresh"));
        }
    }

    function getNCARColor(speedMS) {
        const knots = speedMS / 0.514444; 
        if (knots < 10)  return null; 
        if (knots < 20)  return [150, 150, 255, 160]; 
        if (knots < 30)  return [30, 144, 255, 175];  
        if (knots < 40)  return [0, 200, 100, 190];   
        if (knots < 50)  return [0, 255, 0, 200];     
        if (knots < 60)  return [255, 255, 0, 210];   
        if (knots < 70)  return [255, 190, 0, 220];   
        if (knots < 80)  return [255, 120, 0, 230];   
        if (knots < 90)  return [255, 0, 0, 240];     
        if (knots < 100) return [210, 0, 100, 245];   
        if (knots < 110) return [255, 0, 255, 250];   
        if (knots < 120) return [180, 50, 200, 255];  
        return [255, 255, 255, 255];                  
    }

    function renderVelocityCanvasStack(jsonData, drawHeatmap, drawArrows) {
        const uData = jsonData[0].data; const vData = jsonData[1].data;
        const header = jsonData[0].header; const { nx, ny, lo1, la1, lo2, la2 } = header;

        const canvas = document.createElement('canvas'); canvas.width = nx; canvas.height = ny;
        const ctx = canvas.getContext('2d');

        if (drawHeatmap) {
            const imgData = ctx.createImageData(nx, ny);
            for (let idx = 0; idx < uData.length; idx++) {
                const canvasIdx = idx * 4;
                const speed = Math.sqrt(uData[idx]*uData[idx] + vData[idx]*vData[idx]);
                const color = getNCARColor(speed);
                if (color) {
                    imgData.data[canvasIdx]     = color[0]; imgData.data[canvasIdx + 1] = color[1]; 
                    imgData.data[canvasIdx + 2] = color[2]; imgData.data[canvasIdx + 3] = color[3];                    
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        drawWebGLWindCoastlines(ctx, nx, ny, header);
        let w = lo1 > 180 ? lo1 - 360 : lo1; let e = lo2 > 180 ? lo2 - 360 : lo2; if (e <= w) e += 360;

        velocityTextureLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({
            url: canvas.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la2, e, la1)
        }));

        if (drawArrows) { renderWindVectorArrows(jsonData); }
        enforceLayerOrdering();
    }

    function renderWindVectorArrows(jsonData) {
        const uData = jsonData[0].data; const vData = jsonData[1].data;
        const header = jsonData[0].header; const { nx, ny, lo1, la1, lo2, la2 } = header;

        const canvas = document.createElement('canvas'); canvas.width = 3072; canvas.height = 1536;
        const ctx = canvas.getContext('2d'); const arrowSpacing = 24; 
        const scaleX = canvas.width / nx; const scaleY = canvas.height / ny;
        ctx.lineWidth = 1.6;

        for (let y = arrowSpacing / 2; y < canvas.height; y += arrowSpacing) {
            for (let x = arrowSpacing / 2; x < canvas.width; x += arrowSpacing) {
                const gridX = Math.floor(x / scaleX); const gridY = Math.floor(y / scaleY);
                const idx = gridY * nx + gridX;

                if (idx >= 0 && idx < uData.length) {
                    const u = uData[idx]; const v = vData[idx];
                    const speed = Math.sqrt(u * u + v * v);

                    if (speed > 1.0) { 
                        const angle = Math.atan2(-v, u); 
                        const arrowLength = Math.max(10, Math.min(22, speed * 0.6));
                        ctx.save(); ctx.translate(x, y); ctx.rotate(angle);

                        const knots = speed / 0.514444; let targetArrowColor = "#ffffff";
                        if (knots < 22) targetArrowColor = "#ffffff";
                        else if (knots <= 33) targetArrowColor = "#8e8e93";
                        else if (knots <= 47) targetArrowColor = "#30d158";
                        else if (knots <= 63) targetArrowColor = "#0a84ff";
                        else if (knots <= 82) targetArrowColor = "#ffd60a";
                        else if (knots <= 95) targetArrowColor = "#ff9f0a";
                        else if (knots <= 112) targetArrowColor = "#ff453a";
                        else targetArrowColor = "#b30000";

                        ctx.strokeStyle = targetArrowColor;
                        ctx.beginPath(); ctx.moveTo(-arrowLength / 2, 0); ctx.lineTo(arrowLength / 2, 0); ctx.stroke();

                        const headSize = arrowLength * 0.35;
                        ctx.beginPath(); ctx.moveTo(arrowLength / 2, 0);
                        ctx.lineTo(arrowLength / 2 - headSize, -headSize * 0.5);
                        ctx.moveTo(arrowLength / 2, 0);
                        ctx.lineTo(arrowLength / 2 - headSize, headSize * 0.5);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }
        }
        let w = lo1 > 180 ? lo1 - 360 : lo1; let e = lo2 > 180 ? lo2 - 360 : lo2; if (e <= w) e += 360;
        arrowTextureLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({
            url: canvas.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la2, e, la1)
        }));
    }

    function renderPrecipitationTexture(jsonData) {
        const { data, header } = jsonData; const { nx, ny, lo1, la1, lo2, la2 } = header;
        const canvas = document.createElement('canvas'); canvas.width = nx; canvas.height = ny;
        const ctx = canvas.getContext('2d'); const imgData = ctx.createImageData(nx, ny);

        for (let idx = 0; idx < data.length; idx++) {
            const val = data[idx];
            if (val > 0.1) {
                const canvasIdx = idx * 4;
                if (val < 10) { imgData.data[canvasIdx+1] = 180; imgData.data[canvasIdx+2] = 255; imgData.data[canvasIdx+3] = 120; } 
                else if (val < 30) { imgData.data[canvasIdx] = 255; imgData.data[canvasIdx+1] = 200; imgData.data[canvasIdx+3] = 170; } 
                else { imgData.data[canvasIdx] = 255; imgData.data[canvasIdx+3] = 220; }
            }
        }
        ctx.putImageData(imgData, 0, 0);
        let w = lo1 > 180 ? lo1 - 360 : lo1; let e = lo2 > 180 ? lo2 - 360 : lo2; if (e <= w) e += 360;

        precipTextureLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({
            url: canvas.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la2, e, la1)
        }));
        enforceLayerOrdering();
    }

    function renderIsobarContours(jsonData) {
        const { data, header } = jsonData; const { nx, ny, lo1, la1, dx, dy } = header;
        const canvas = document.createElement('canvas'); canvas.width = 4096; canvas.height = 2048;
        const ctx = canvas.getContext('2d');
        
        ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
        ctx.textBaseline = 'middle'; ctx.textAlign = 'center';

        const isobarIntervals = [];
        for (let p = 96000; p <= 104000; p += 400) { isobarIntervals.push(p); }

        isobarIntervals.forEach(targetIso => {
            const valString = String(Math.round(targetIso / 100));
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = 'bold 18px monospace';

            for (let y = 0; y < ny - 1; y++) {
                for (let x = 0; x < nx - 1; x++) {
                    const i = y * nx + x;
                    const points = getCellIntersections(x, y, data[i], data[i + 1], data[i + nx], data[i + nx + 1], targetIso);
                    
                    if (points.length >= 2) {
                        const x1 = (points[0].x / nx) * canvas.width; const y1 = (points[0].y / ny) * canvas.height;
                        const x2 = (points[1].x / nx) * canvas.width; const y2 = (points[1].y / ny) * canvas.height;

                        if (x % 36 === 0 && y % 36 === 0) {
                            let angle = Math.atan2(y2 - y1, x2 - x1);
                            if (angle > Math.PI / 2 || angle < -Math.PI / 2) { angle += Math.PI; }
                            ctx.save(); ctx.translate(x1, y1); ctx.rotate(angle);
                            ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
                            ctx.fillText(valString, 0, 0); ctx.restore();
                        } else {
                            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                        }
                    }
                }
            }
        });

        let w = lo1 > 180 ? lo1 - 360 : lo1; 
        let e = (lo1 + (nx * dx)) > 180 ? (lo1 + (nx * dx)) - 360 : (lo1 + (nx * dx)); if (e <= w) e += 360;

        combinedOutputLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({
            url: canvas.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la1 - (ny * dy), e, la1)
        }));
        enforceLayerOrdering();
    }

    function getCellIntersections(x, y, vTL, vTR, vBL, vBR, iso) {
        let pts = [];
        if ((vTL >= iso) !== (vTR >= iso)) pts.push({ x: x + (iso - vTL) / (vTR - vTL), y: y });
        if ((vBL >= iso) !== (vBR >= iso)) pts.push({ x: x + (iso - vBL) / (vBR - vBL), y: y + 1 });
        if ((vTL >= iso) !== (vBL >= iso)) pts.push({ x: x, y: y + (iso - vTL) / (vBL - vTL) });
        if ((vTR >= iso) !== (vBR >= iso)) pts.push({ x: x + 1, y: y + (iso - vTR) / (vBR - vTR) });
        return pts;
    }

    // Dynamic Mouse Hover Coordinate Lookup Handler
    const mouseHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    mouseHandler.setInputAction(function(movement) {
        if (!activeDataset && !activePrecipDataset) { trackingLabel.style.display = 'none'; return; }
        const cartesian = viewer.camera.pickEllipsoid(movement.endPosition, viewer.scene.globe.ellipsoid);
        
        if (cartesian) {
            const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
            let lon = Cesium.Math.toDegrees(cartographic.longitude);
            let lat = Cesium.Math.toDegrees(cartographic.latitude);

            const header = activeDataset ? activeDataset[0].header : activePrecipDataset.header;
            if (lon < 0 && header.lo1 >= 0) lon += 360;

            if (lon >= header.lo1 && lon <= header.lo2 && lat >= header.la2 && lat <= header.la1) {
                const nx = header.nx; const ny = header.ny;
                const xIdx = Math.floor(((lon - header.lo1) / (header.lo2 - header.lo1)) * nx);
                const yIdx = Math.floor(((header.la1 - lat) / (header.la1 - header.la2)) * ny);
                const gridIdx = yIdx * nx + xIdx;

                let labelHTML = `<strong>📍 Location Data</strong><br>Lat: ${lat.toFixed(2)}° | Lon: ${lon.toFixed(2)}°<br>`;

                if (activeDataset && gridIdx < activeDataset[0].data.length) {
                    const u = activeDataset[0].data[gridIdx]; const v = activeDataset[1].data[gridIdx];
                    const speedms = Math.sqrt(u*u + v*v); const speedKnots = speedms / 0.514444;
                    labelHTML += `<hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:4px 0;">
                                  <strong>💨 Velocity Metrics</strong><br>Speed: ${speedKnots.toFixed(1)} kt (${speedms.toFixed(1)} m/s)`;
                }

                if (activePrecipDataset && gridIdx < activePrecipDataset.data.length) {
                    const precipVal = activePrecipDataset.data[gridIdx];
                    labelHTML += `<hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:4px 0;">
                                  <strong>🌧️ Forecast Precip Rate</strong><br>Intensity: ${precipVal.toFixed(2)} mm/6 hr`;
                }

                trackingLabel.style.display = 'block';
                trackingLabel.style.left = (movement.endPosition.x + 15) + 'px';
                trackingLabel.style.top = (movement.endPosition.y + 15) + 'px';
                trackingLabel.innerHTML = labelHTML;
                return;
            }
        }
        trackingLabel.style.display = 'none';
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    // Initial Engine Bootstrap Initialization
    changeBasemap('dark');
    fetchWebGLWindCoastlines();

    viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(122.0, 24.0, 5000000), // Clean vantage overview over East Asia
        orientation: {
            heading: Cesium.Math.toRadians(0.0),
            pitch: Cesium.Math.toRadians(-90.0),
            roll: 0.0
        }
    });
</script>
</body>
