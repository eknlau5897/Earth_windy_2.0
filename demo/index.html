<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Earth Windy 2.0 - Cesium Engine</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            background-color: #000; font-family: monospace;
        }
        #controlPanel {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(10, 15, 28, 0.85); border: 1px solid #1e293b;
            border-radius: 8px; padding: 15px; width: 310px; color: #f8fafc;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(6px);
        }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; letter-spacing: 1px; }
        select, input[type="range"] {
            width: 100%; background: #1e293b; border: 1px solid #334155;
            color: #fff; padding: 6px; border-radius: 4px; box-sizing: border-box;
        }
        .checkbox-container { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 6px; }
        .checkbox-container input { cursor: pointer; }
        #timeDisplayPanel {
            margin-top: 10px; padding-top: 10px; border-top: 1px solid #334155;
            font-size: 12px; color: #38bdf8; display: flex; flex-direction: column; gap: 2px;
        }
    </style>
</head>
<body>

<div id="controlPanel">
    <div class="control-group">
        <label for="modelSelect">Forecast Model Source</label>
        <select id="modelSelect" onchange="updateWeatherLayers()">
            <option value="gfs">Global Forecast System (GFS)</option>
            <option value="ecmwf">ECMWF High-Res (IFS)</option>
            <option value="aifs">ECMWF AI Forecast (AIFS)</option>
            <option value="cwawrf">Taiwan CWA WRF (Regional)</option>
        </select>
    </div>

    <div class="control-group">
        <label for="levelSelect">Atmospheric Vertical Level</label>
        <select id="levelSelect" onchange="updateWeatherLayers()">
            <option value="10m">10 Meters Surface Layer</option>
            <option value="850">850 hPa (~1,500m / Low-Jet)</option>
            <option value="700">700 hPa (~3,000m / Moisture)</option>
            <option value="500">500 hPa (~5,500m / Mid-Troposphere)</option>
            <option value="200">200 hPa (~12,000m / Jetstream)</option>
        </select>
    </div>

    <div class="control-group">
        <label>Forecast Lead Window: +<span id="hourVal">000</span>hr</label>
        <input id="timeSlider" type="range" min="0" max="49" value="0" step="1" oninput="updateWeatherLayers()">
    </div>

    <div class="checkbox-container">
        <input type="checkbox" id="showWindSpeed" checked onchange="updateWeatherLayers()">
        <label for="showWindSpeed" style="display:inline; color:#fff;">Overlay Wind Scalar Grid</label>
    </div>
    <div class="checkbox-container">
        <input type="checkbox" id="showParticles" checked onchange="toggleParticles()">
        <label for="showParticles" style="display:inline; color:#fff;">Animate Wind Particles</label>
    </div>
    <div class="checkbox-container">
        <input type="checkbox" id="showIsobars" checked onchange="updateWeatherLayers()">
        <label for="showIsobars" style="display:inline; color:#fff;">Overlay Red Isobar Contours</label>
    </div>
    <div class="checkbox-container">
        <input type="checkbox" id="showRadar" checked onchange="updateWeatherLayers()">
        <label for="showRadar" style="display:inline; color:#fff;">Enable RainViewer Radar</label>
    </div>
    <div class="checkbox-container">
        <input type="checkbox" id="showCoastlines" checked onchange="toggleCoastlines()">
        <label for="showCoastlines" style="display:inline; color:#fff;">High-Contrast Coastlines</label>
    </div>

    <div id="timeDisplayPanel">
        <span id="validTimeVal">Valid: Initializing...</span>
    </div>
</div>

<div id="cesiumContainer"></div>

<script>
    const cdnBase = "./data"; 
    let currentUpdateToken = 0;

    const forecastHours = [];
    for (let h = 0; h <= 120; h += 6) { forecastHours.push(String(h).padStart(3, '0')); }
    for (let h = 132; h <= 240; h += 12) { forecastHours.push(String(h).padStart(3, '0')); }

    const viewer = new Cesium.Viewer('cesiumContainer', {
        imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
            url: 'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer'
        }),
        geocoder: false, homeButton: false, sceneModePicker: false,
        baseLayerPicker: false, navigationHelpButton: false, animation: false,
        timeline: false, fullscreenButton: false
    });
    viewer.scene.globe.baseColor = Cesium.Color.BLACK;

    let velocityTextureLayer = null;
    let combinedOutputLayer = null;
    let radarLayer = null;
    let coastlineDataSource = null;
    let activeDataset = null;

    // --- Particle Animation Engine Variables ---
    let particleCollection = [];
    let particlePrimitives = null;
    const MAX_PARTICLES = 3500; 
    const PARTICLE_MAX_AGE = 40; 
    let particleAnimationLoop = null;

    initCoastlines();

    function calculateOperationalBaseTime(model) {
        const now = new Date();
        const utcHr = now.getUTCHours();
        let base = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
        
        if (model === 'gfs') {
            if (utcHr >= 6 && utcHr < 18) base.setUTCHours(0);
            else if (utcHr >= 18) base.setUTCHours(12);
            else { base.setUTCDate(base.getUTCDate() - 1); base.setUTCHours(12); }
        } else if (model === 'ecmwf' || model === 'aifs') {
            let threshold = model === 'ecmwf' ? 9 : 7;
            if (utcHr >= threshold && utcHr < (threshold + 12)) base.setUTCHours(0);
            else { base.setUTCHours(12); if (utcHr < threshold) base.setUTCDate(base.getUTCDate() - 1); }
        } else if (model === 'cwawrf') {
            if (utcHr >= 19) base.setUTCHours(12);
            else if (utcHr >= 13) base.setUTCHours(6);
            else if (utcHr >= 7) base.setUTCHours(0);
            else if (utcHr >= 1) base.setUTCHours(18);
            else { base.setUTCDate(base.getUTCDate() - 1); base.setUTCHours(18); }
        }
        return base;
    }

    function updateValidTimeDisplay(modelType, addedHours, directHeaderTime = null) { 
        if (directHeaderTime) {
            document.getElementById('validTimeVal').innerText = `Valid: ${directHeaderTime}`; 
            return;
        }
        const baseTime = calculateOperationalBaseTime(modelType); 
        const formattedDisplay = `${baseTime.getUTCFullYear()}-${String(baseTime.getUTCMonth() + 1).padStart(2, '0')}-${String(baseTime.getUTCDate()).padStart(2, '0')} ${String(baseTime.getUTCHours()).padStart(2, '0')}Z +${addedHours}hr`; 
        document.getElementById('validTimeVal').innerText = `Run: ${formattedDisplay}`; 
    }

    function fetchGzJson(url, token, successCallback) {
        fetch(url)
            .then(res => { if (!res.ok) throw new Error("Network error"); return res.arrayBuffer(); })
            .then(buf => {
                if (token !== currentUpdateToken) return;
                const decompressed = pako.ungzip(new Uint8Array(buf), { to: 'string' });
                successCallback(JSON.parse(decompressed));
            })
            .catch(err => console.log(`Data fetch issue: ${err.message}`));
    }

    function updateWeatherLayers() { 
        const localToken = ++currentUpdateToken; 
        
        [velocityTextureLayer, combinedOutputLayer, radarLayer].forEach(l => { if(l) viewer.imageryLayers.remove(l); }); 
        velocityTextureLayer = combinedOutputLayer = radarLayer = activeDataset = null; 
        clearParticleEngine();

        const model = document.getElementById('modelSelect').value; 
        const level = document.getElementById('levelSelect').value; 
        let sliderIdx = document.getElementById('timeSlider').value; 
        let targetHour = forecastHours[sliderIdx]; 
        
        document.getElementById('hourVal').innerText = targetHour;

        if (model === 'cwawrf' && parseInt(targetHour) > 84) { 
            const maxCwaIndex = forecastHours.indexOf("084"); 
            document.getElementById('timeSlider').value = maxCwaIndex; 
            document.getElementById('hourVal').innerText = "084"; 
            targetHour = "084"; 
        } 

        const activeWindSpeed = document.getElementById('showWindSpeed').checked; 
        const activeIsobars = document.getElementById('showIsobars').checked; 
        const activeRadar = document.getElementById('showRadar').checked;

        updateValidTimeDisplay(model, targetHour); 

        // 1. Process Wind and Initialize Particle Simulation
        if (activeWindSpeed || document.getElementById('showParticles').checked) { 
            fetchGzJson(`${cdnBase}/${model}_${level}_f${targetHour}.json.gz`, localToken, data => { 
                activeDataset = data; 
                if (data && data[0] && data[0].header && data[0].header.validTime) {
                    updateValidTimeDisplay(model, targetHour, data[0].header.validTime);
                }
                renderVelocityCanvasStack(data, activeWindSpeed); 
                if (document.getElementById('showParticles').checked) {
                    initParticleEngine(data);
                }
            }); 
        } 
        
        // 2. Process MSLP Isobars
        if (activeIsobars && model !== 'cwawrf') { 
            fetchGzJson(`${cdnBase}/${model}_mslp_f${targetHour}.json.gz`, localToken, data => {
                if (data && data.header && data.header.validTime && !activeWindSpeed) {
                    updateValidTimeDisplay(model, targetHour, data.header.validTime);
                }
                renderIsobarContours(data);
            }); 
        } 

        // 3. Process Weather Radar
        if (activeRadar) updateRadarOverlay();
    }

    // --- RESTORED PARTICLE SIMULATION ENGINE ---
    function initParticleEngine(windData) {
        clearParticleEngine();
        if (!windData || !windData[0]) return;

        const uField = windData[0];
        const { lo1, la1, nx, ny, dx, dy } = uField.header;
        
        // Handle bounding boxes with wrap-around logic
        let w = lo1 > 180 ? lo1 - 360 : lo1;
        let e = w + (nx * dx);
        let n = la1;
        let s = la1 - (ny * dy);

        particlePrimitives = viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());

        // Initialize points at random positions inside the domain
        for (let i = 0; i < MAX_PARTICLES; i++) {
            const lon = w + Math.random() * (e - w);
            const lat = s + Math.random() * (n - s);
            
            const pt = particlePrimitives.add({
                position: Cesium.Cartesian3.fromDegrees(lon, lat, 100),
                color: Cesium.Color.WHITE.withAlpha(0.6),
                pointSize: 2.0
            });

            particleCollection.push({
                primitive: pt, lon: lon, lat: lat, age: Math.floor(Math.random() * PARTICLE_MAX_AGE)
            });
        }

        // Kinetic advection animation loop
        particleAnimationLoop = setInterval(() => {
            const uData = windData[0].data;
            const vData = windData[1].data;

            for (let i = 0; i < particleCollection.length; i++) {
                const p = particleCollection[i];
                p.age++;

                // Lookup vector coordinate mappings
                let xIdx = Math.floor(((p.lon - w) / (e - w)) * nx);
                let yIdx = Math.floor(((n - p.lat) / (n - s)) * ny);
                let dataIdx = yIdx * nx + xIdx;

                if (xIdx >= 0 && xIdx < nx && yIdx >= 0 && yIdx < ny && p.age < PARTICLE_MAX_AGE && uData[dataIdx] !== undefined) {
                    const u = uData[dataIdx];
                    const v = vData[dataIdx];
                    
                    // Degree scaling parameter
                    p.lon += (u * 0.00015);
                    p.lat += (v * 0.00015);
                    
                    p.primitive.position = Cesium.Cartesian3.fromDegrees(p.lon, p.lat, 100);
                    
                    // Fade out aging particles smoothly
                    let alpha = 1.0 - (p.age / PARTICLE_MAX_AGE);
                    p.primitive.color = Cesium.Color.WHITE.withAlpha(alpha * 0.7);
                } else {
                    // Respawn expired or out-of-bounds stream vectors
                    p.lon = w + Math.random() * (e - w);
                    p.lat = s + Math.random() * (n - s);
                    p.age = 0;
                    p.primitive.position = Cesium.Cartesian3.fromDegrees(p.lon, p.lat, 100);
                    p.primitive.color = Cesium.Color.WHITE.withAlpha(0.6);
                }
            }
        }, 35);
    }

    function clearParticleEngine() {
        if (particleAnimationLoop) clearInterval(particleAnimationLoop);
        if (particlePrimitives) { viewer.scene.primitives.remove(particlePrimitives); }
        particleCollection = [];
        particlePrimitives = null;
    }

    function toggleParticles() {
        if (document.getElementById('showParticles').checked) {
            if (activeDataset) initParticleEngine(activeDataset);
            else updateWeatherLayers();
        } else {
            clearParticleEngine();
        }
    }

    function updateRadarOverlay() {
        fetch('https://api.rainviewer.com/public/maps.json')
            .then(res => res.json())
            .then(timestamps => {
                if (!timestamps || timestamps.length === 0) return;
                const latestRadarTime = timestamps[timestamps.length - 1];
                radarLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
                    url: `https://tilecache.rainviewer.com/v2/radar/${latestRadarTime}/256/{z}/{x}/{y}/2/1_1.png`,
                    minimumLevel: 0, maximumLevel: 12
                }));
                enforceLayerOrdering();
            }).catch(err => console.error("Radar sync error:", err));
    }

    function initCoastlines() {
        Cesium.GeoJsonDataSource.load('https://raw.githubusercontent.com/glynnbird/countriesgeojson/master/world.geojson', {
            stroke: Cesium.Color.fromCssColorString('#475569'), fill: Cesium.Color.TRANSPARENT, strokeWidth: 1.5
        }).then(dataSource => {
            coastlineDataSource = dataSource; viewer.dataSources.add(dataSource);
        });
    }

    function toggleCoastlines() {
        if (coastlineDataSource) coastlineDataSource.show = document.getElementById('showCoastlines').checked;
    }

    function renderVelocityCanvasStack(windData, showScalarGrid) {
        if (!windData || !windData[0] || !showScalarGrid) return;
        const uField = windData[0]; const vField = windData[1];
        const { nx, ny, lo1, la1, dx, dy } = uField.header;

        const canvas = document.createElement('canvas'); canvas.width = nx; canvas.height = ny;
        const ctx = canvas.getContext('2d'); const imgData = ctx.createImageData(nx, ny);

        for (let y = 0; y < ny; y++) {
            for (let x = 0; x < nx; x++) {
                const idx = y * nx + x;
                const speed = Math.sqrt(uField.data[idx]**2 + vField.data[idx]**2);
                const alpha = Math.min(speed / 35.0, 1.0);
                const pIdx = idx * 4;
                imgData.data[pIdx] = Math.round(alpha * 255);
                imgData.data[pIdx+1] = Math.round(Math.max(0, 1.0 - alpha) * 150);
                imgData.data[pIdx+2] = 255;
                imgData.data[pIdx+3] = Math.round(alpha * 180);
            }
        }
        ctx.putImageData(imgData, 0, 0);

        let w = lo1 > 180 ? lo1 - 360 : lo1;
        let e = w + (nx * dx); if (e <= w) e += 360;

        velocityTextureLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({
            url: canvas.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la1 - (ny * dy), e, la1)
        }));
        enforceLayerOrdering();
    }

    function renderIsobarContours(jsonData) { 
        if (!jsonData || !jsonData.data) return;
        const { data, header } = jsonData; const { nx, ny, lo1, la1, dx, dy } = header; 
        
        const canvasT = document.createElement('canvas'); canvasT.width = 2048; canvasT.height = 1024;
        const ctxT = canvasT.getContext('2d'); ctxT.lineWidth = 1.4; ctxT.textBaseline = 'middle'; ctxT.textAlign = 'center'; 

        for (let p = 97000; p <= 104000; p += 400) { 
            ctxT.strokeStyle = 'rgba(255, 59, 48, 0.7)'; ctxT.fillStyle = 'rgba(255, 69, 58, 1.0)'; ctxT.font = 'bold 12px monospace'; 
            
            for (let y = 0; y < ny - 1; y++) { 
                for (let x = 0; x < nx - 1; x++) { 
                    const i = y * nx + x; 
                    const pts = getCellIntersections(x, y, data[i], data[i+1], data[i+nx], data[i+nx+1], p); 
                    if (pts.length >= 2) { 
                        const x1 = (pts[0].x / nx) * canvasT.width; const y1 = (pts[0].y / ny) * canvasT.height; 
                        const x2 = (pts[1].x / nx) * canvasT.width; const y2 = (pts[1].y / ny) * canvasT.height; 
                        
                        if (x % 50 === 0 && y % 50 === 0) { ctxT.fillText(String(Math.round(p / 100)), x1, y1); } 
                        else { ctxT.beginPath(); ctxT.moveTo(x1, y1); ctxT.lineTo(x2, y2); ctxT.stroke(); } 
                    } 
                } 
            } 
        } 
        let w = lo1 > 180 ? lo1 - 360 : lo1; let e = w + (nx * dx); if (e <= w) e += 360; 
        combinedOutputLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({ 
            url: canvasT.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la1 - (ny * dy), e, la1) 
        })); 
        enforceLayerOrdering(); 
    }

    function getCellIntersections(x, y, v00, v10, v01, v11, target) {
        const pts = [];
        if ((v00 >= target && v10 < target) || (v00 < target && v10 >= target)) { let t = (target - v00) / (v10 - v00); pts.push({ x: x + t, y: y }); }
        if ((v10 >= target && v11 < target) || (v10 < target && v11 >= target)) { let t = (target - v10) / (v11 - v10); pts.push({ x: x + 1, y: y + t }); }
        if ((v01 >= target && v11 < target) || (v01 < target && v11 >= target)) { let t = (target - v01) / (v11 - v01); pts.push({ x: x + t, y: y + 1 }); }
        if ((v00 >= target && v01 < target) || (v00 < target && v01 >= target)) { let t = (target - v00) / (v01 - v00); pts.push({ x: x, y: y + t }); }
        return pts;
    }

    function enforceLayerOrdering() {
        if (velocityTextureLayer) viewer.imageryLayers.raiseToTop(velocityTextureLayer);
        if (radarLayer) viewer.imageryLayers.raiseToTop(radarLayer);
        if (combinedOutputLayer) viewer.imageryLayers.raiseToTop(combinedOutputLayer);
    }

    updateWeatherLayers();
</script>
</body>
</html>
