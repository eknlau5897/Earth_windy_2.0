<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <title>地球風場3D</title> 
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script> 
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet"> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script> 
    <style> 
        html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #000; } 
        #controlPanel { 
            position: absolute; top: 20px; left: 20px; width: 330px; max-height: 90vh; 
            background: rgba(10, 10, 14, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            padding: 22px; border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            color: #e4e4e7; z-index: 1000; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.08); overflow-y: auto; 
        } 
        h3 { margin-top: 0; font-size: 16px; font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px; color: #fff; letter-spacing: 0.3px; } 
        .control-group { margin-bottom: 18px; } 
        .control-group label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; color: #a1a1aa; margin-bottom: 6px; letter-spacing: 0.8px; } 
        select { width: 100%; background: #1f1f23; color: #fff; border: 1px solid #2d2d34; padding: 10px 12px; border-radius: 7px; font-size: 13px; cursor: pointer; outline: none; } 
        input[type="range"] { width: 100%; background: #2d2d34; height: 6px; border-radius: 3px; outline: none; -webkit-appearance: none; } 
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #0a84ff; cursor: pointer; } 
        .toggle-container { border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 14px; margin-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; } 
        .toggle-container label { cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 500; } 
        .toggle-container input[type="checkbox"] { width: 16px; height: 16px; accent-color: #0a84ff; cursor: pointer; } 
        #legend { position: absolute; bottom: 30px; right: 30px; background: rgba(10, 10, 14, 0.85); padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); font-family: monospace; font-size: 11px; color: #fff; z-index: 1000; pointer-events: none; display: none; } 
        .valid-time-display { font-size: 11px; font-family: monospace; color: #34c759; margin-top: 4px; display: block; } 
    </style> 
</head> 
<body> 

<div id="controlPanel"> 
    <h3>地球風場3D</h3> 
    <div class="control-group"> 
        <label>Forecast Model Core</label> 
        <select id="modelSelect" onchange="updateWeatherLayers()"> 
            <option value="gfs">NCEP GFS (Global Forecast System)</option> 
            <option value="ecmwf">ECMWF IFS (High-Resolution)</option> 
            <option value="aifs">ECMWF AIFS (Artificial Intelligence)</option> 
        </select> 
    </div> 

    <div class="control-group"> 
        <label>Atmospheric Level Boundary</label> 
        <select id="levelSelect" onchange="updateWeatherLayers()"> 
            <option value="10m">10-Meter Surface Boundary Layer</option> 
            <option value="850">850 hPa (~1,500 m)</option> 
            <option value="700">700 hPa (~2,500 m)</option> 
            <option value="500">500 hPa (~5,500 m)</option> 
            <option value="200">200 hPa (~12,000 m)</option> 
        </select> 
    </div> 

    <div class="control-group"> 
        <label>Forecast Timeline: +<span id="hourVal">000</span> Hours</label> 
        <input type="range" id="timeSlider" min="0" value="0" step="1" oninput="handleSliderChange(this.value)"> 
        <span class="valid-time-display" id="validTimeVal">Valid: Calculating run operational baseline...</span> 
    </div> 

    <div class="control-group"> 
        <label>GIS Base Map Canvas</label> 
        <select id="basemapSelect" onchange="changeBasemap(this.value)"> 
            <option value="dark">CartoDB Dark Matter</option> 
            <option value="satellite">ArcGIS Satellite</option> 
        </select> 
    </div> 

    <div class="toggle-container"> 
        <label><input type="checkbox" id="showCoastlines" checked onchange="updateWeatherLayers()"> WebGL-Wind Coastlines (White)</label> 
        <label><input type="checkbox" id="showWindSpeed" onchange="updateWeatherLayers()"> NCAR Wind Speed Heatmap (0-120kt)</label> 
        <label><input type="checkbox" id="showWindArrows" checked onchange="updateWeatherLayers()"> Large Movable Wind Arrows</label> 
        <label><input type="checkbox" id="showIsobars" checked onchange="updateWeatherLayers()"> Pressure Isobars</label> 
        <label><input type="checkbox" id="showPrecip" onchange="updateWeatherLayers()"> Forecast Precipitation Intensity</label> 
        <hr style="width:100%; border:0; border-top:1px solid rgba(255,255,255,0.1); margin: 5px 0;"> 
        <label><input type="checkbox" id="realtimeRadar" onchange="toggleRealtimeRadar(this.checked)"> 📡 Live Weather Radar (RainViewer)</label> 
        <label><input type="checkbox" id="h9Satellite" onchange="toggleH9Satellite(this.checked)"> Himawari-9 Band 13 (IR Satellite Live)</label> 
    </div> 
</div> 

<div id="legend"></div> 
<div id="cesiumContainer"></div> 

<script> 
const viewer = new Cesium.Viewer('cesiumContainer', { 
    imageryProvider: false, baseLayerPicker: false, geocoder: false, homeButton: true, 
    infoBox: false, navigationHelpButton: false, sceneModePicker: true, timeline: false, animation: false 
}); 

// 1. Build and Sync Timeline Index arrays
const forecastHours = []; 
for (let h = 0; h <= 120; h += 6) forecastHours.push(String(h).padStart(3, '0')); 
for (let h = 132; h <= 240; h += 12) forecastHours.push(String(h).padStart(3, '0')); 
document.getElementById('timeSlider').max = forecastHours.length - 1; 

let currentBaseLayer = null, h9SatelliteLayer = null, liveRadarLayer = null; 
let velocityTextureLayer = null, precipTextureLayer = null, combinedOutputLayer = null, arrowTextureLayer = null; 
let activeDataset = null, activePrecipDataset = null, webglWindCoastlineGeoJSON = null; 
let currentUpdateToken = 0; 
const cdnBase = `https://lc2nz3kv-5500.asse.devtunnels.ms/demo/`; 

// 2. Inline Setup for Info Tracking Overlay Label
const trackingLabel = document.createElement('div'); 
trackingLabel.style.cssText = `position: absolute; background: rgba(10, 10, 14, 0.92); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: monospace; font-size: 12px; pointer-events: none; display: none; z-index: 5000; box-shadow: 0 6px 20px rgba(0,0,0,0.6);`; 
document.body.appendChild(trackingLabel); 

function calculateOperationalBaseTime(modelType) { 
    const now = new Date(); 
    let runYear = now.getUTCFullYear(), runMonth = now.getUTCMonth(), runDay = now.getUTCDate(), runHour = 0; 
    const utcHours = now.getUTCHours(); 

    if (modelType === 'ecmwf' || modelType === 'aifs') { 
        if (utcHours >= 22) runHour = 12; 
        else if (utcHours >= 10) runHour = 0; 
        else { 
            const yesterday = new Date(Date.UTC(runYear, runMonth, runDay - 1)); 
            runYear = yesterday.getUTCFullYear(); runMonth = yesterday.getUTCMonth(); runDay = yesterday.getUTCDate(); runHour = 12; 
        } 
    } else { 
        if (utcHours >= 19) runHour = 12; 
        else if (utcHours >= 13) runHour = 6; 
        else if (utcHours >= 7) runHour = 0; 
        else { 
            const yesterday = new Date(Date.UTC(runYear, runMonth, runDay - 1)); 
            runYear = yesterday.getUTCFullYear(); runMonth = yesterday.getUTCMonth(); runDay = yesterday.getUTCDate(); 
            runHour = utcHours >= 1 ? 18 : 12; 
        } 
    } 
    return new Date(Date.UTC(runYear, runMonth, runDay, runHour)); 
} 

function updateValidTimeDisplay(modelType, addedHours) { 
    const baseTime = calculateOperationalBaseTime(modelType); 
    const formattedDisplay = `${baseTime.getUTCFullYear()}-${String(baseTime.getUTCMonth() + 1).padStart(2, '0')}-${String(baseTime.getUTCDate()).padStart(2, '0')} ${String(baseTime.getUTCHours()).padStart(2, '0')}Z +${addedHours}hr`; 
    document.getElementById('validTimeVal').innerText = `Run: ${formattedDisplay}`; 
} 

function handleSliderChange(val) { 
    document.getElementById('hourVal').innerText = forecastHours[val]; 
    updateWeatherLayers(); 
} 

function changeBasemap(type) { 
    if (currentBaseLayer) viewer.imageryLayers.remove(currentBaseLayer); 
    let url = type === 'dark' ? 'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png' : 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'; 
    currentBaseLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({ url })); 
    viewer.imageryLayers.lowerToBottom(currentBaseLayer); 
} 

function fetchWebGLWindCoastlines() { 
    fetch('https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_coastline.geojson') 
        .then(res => res.json()).then(data => { webglWindCoastlineGeoJSON = data; updateWeatherLayers(); }); 
} 

function drawWebGLWindCoastlines(ctx, width, height, header) { 
    if (!document.getElementById('showCoastlines').checked || !webglWindCoastlineGeoJSON) return; 
    ctx.save(); ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255,255,255,0.4)'; 
    const { lo1, la1, lo2, la2 } = header; 
    const lonRange = lo2 - lo1, latRange = la1 - la2; 

    webglWindCoastlineGeoJSON.features.forEach(f => { 
        const line = f.geometry.coordinates; let firstPoint = true, lastX = null; 
        ctx.beginPath(); 
        line.forEach(pt => { 
            let lon = pt[0]; const lat = pt[1]; 
            if (lo1 >= 0 && lon < 0) lon += 360; 
            const x = ((lon - lo1) / lonRange) * width, y = ((la1 - lat) / latRange) * height; 
            if (!firstPoint && lastX !== null && Math.abs(x - lastX) > width * 0.5) ctx.moveTo(x, y); 
            else firstPoint ? ctx.moveTo(x, y) : ctx.lineTo(x, y); 
            firstPoint = false; lastX = x; 
        }); 
        ctx.stroke(); 
    }); 
    ctx.restore(); 
} 

function toggleRealtimeRadar(isVisible) { 
    if (liveRadarLayer) { viewer.imageryLayers.remove(liveRadarLayer); liveRadarLayer = null; } 
    if (!isVisible) return; 
    fetch('https://api.rainviewer.com/public/weather-maps.json').then(res => res.json()).then(data => { 
        if (data?.radar?.past?.length > 0) { 
            liveRadarLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({ url: `${data.host}${data.radar.past[data.radar.past.length - 1].path}/256/{z}/{x}/{y}/2/1_1.png`, maximumLevel: 7 })); 
            enforceLayerOrdering(); 
        } 
    }); 
} 

function toggleH9Satellite(isVisible) { 
    if (h9SatelliteLayer) { viewer.imageryLayers.remove(h9SatelliteLayer); h9SatelliteLayer = null; } 
    if (!isVisible) return; 
    const d = new Date(); d.setHours(d.getHours() - 2); 
    const ymd = d.toISOString().split('T')[0], hours = String(d.getUTCHours()).padStart(2, '0'), mins = String(Math.floor(d.getUTCMinutes() / 10) * 10).padStart(2, '0'); 
    h9SatelliteLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({ url: `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/Himawari9_AHI_Clean_Infrared_Band13/default/${ymd}T${hours}:${mins}:00/GoogleMapsCompatible_Level9/{z}/{y}/{x}.png`, maximumLevel: 9 })); 
    enforceLayerOrdering(); 
} 

function enforceLayerOrdering() { 
    if (currentBaseLayer) viewer.imageryLayers.lowerToBottom(currentBaseLayer); 
    [velocityTextureLayer, precipTextureLayer, h9SatelliteLayer, liveRadarLayer, arrowTextureLayer, combinedOutputLayer].forEach(layer => { 
        if (layer) viewer.imageryLayers.raiseToTop(layer); 
    }); 
} 

async function fetchGzJson(url, token, callback) { 
    try { 
        const res = await fetch(url); if (!res.ok) return; 
        const buf = await res.arrayBuffer(); 
        if (token === currentUpdateToken) callback(JSON.parse(pako.inflate(new Uint8Array(buf), { to: 'string' }))); 
    } catch(e) {} 
} 

function updateWeatherLayers() { 
    const localToken = ++currentUpdateToken; 
    [velocityTextureLayer, precipTextureLayer, combinedOutputLayer, arrowTextureLayer].forEach(l => { if(l) viewer.imageryLayers.remove(l); }); 
    velocityTextureLayer = precipTextureLayer = combinedOutputLayer = arrowTextureLayer = activeDataset = activePrecipDataset = null; 

    const model = document.getElementById('modelSelect').value; 
    const level = document.getElementById('levelSelect').value; 
    const targetHour = forecastHours[document.getElementById('timeSlider').value]; 

    const activeWindSpeed = document.getElementById('showWindSpeed').checked; 
    const activeWindArrows = document.getElementById('showWindArrows').checked; 
    const activeIsobars = document.getElementById('showIsobars').checked; 
    const activePrecip = document.getElementById('showPrecip').checked; 

    updateValidTimeDisplay(model, targetHour); 

    if (activeWindSpeed || activeWindArrows || document.getElementById('showCoastlines').checked) { 
        fetchGzJson(`${cdnBase}/${model}_${level}_f${targetHour}.json.gz`, localToken, data => { 
            activeDataset = data; renderVelocityCanvasStack(data, activeWindSpeed, activeWindArrows); 
        }); 
    } 
    if (activePrecip) { 
        fetchGzJson(`${cdnBase}/${model}_rain_f${targetHour}.json.gz`, localToken, data => { 
            activePrecipDataset = data; renderPrecipitationTexture(data); 
        }); 
    } 
    if (activeIsobars) { 
        fetchGzJson(`${cdnBase}/${model}_mslp_f${targetHour}.json.gz`, localToken, renderIsobarContours); 
    } 
} 

function getNCARColor(speedMS) { 
    const knots = speedMS / 0.514444; if (knots < 10) return null; 
    if (knots < 20) return [30, 144, 255, 140]; if (knots < 40) return [0, 200, 100, 160]; 
    if (knots < 60) return [255, 215, 0, 180]; if (knots < 80) return [255, 69, 0, 200]; 
    return [255, 0, 255, 220]; 
} 

function renderVelocityCanvasStack(jsonData, drawHeatmap, drawArrows) { 
    const uData = jsonData[0].data, vData = jsonData[1].data, header = jsonData[0].header; 
    const { nx, ny, lo1, la1, lo2, la2 } = header; 
    const canvas = document.createElement('canvas'); canvas.width = nx; canvas.height = ny; const ctx = canvas.getContext('2d'); 

    if (drawHeatmap) { 
        const imgData = ctx.createImageData(nx, ny); 
        for (let i = 0; i < uData.length; i++) { 
            const cIdx = i * 4, speed = Math.sqrt(uData[i]*uData[i] + vData[i]*vData[i]), color = getNCARColor(speed); 
            if (color) { imgData.data[cIdx] = color[0]; imgData.data[cIdx+1] = color[1]; imgData.data[cIdx+2] = color[2]; imgData.data[cIdx+3] = color[3]; } 
        } 
        ctx.putImageData(imgData, 0, 0); 
    } 

    drawWebGLWindCoastlines(ctx, nx, ny, header); 
    let w = lo1 > 180 ? lo1 - 360 : lo1, e = lo2 > 180 ? lo2 - 360 : lo2; if (e <= w) e += 360; 

    velocityTextureLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({ url: canvas.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la2, e, la1) })); 
    if (drawArrows) renderWindVectorArrows(jsonData); 
    enforceLayerOrdering(); 
} 

function renderWindVectorArrows(jsonData) { 
    const uData = jsonData[0].data, vData = jsonData[1].data, header = jsonData[0].header; 
    const { nx, ny, lo1, la1, lo2, la2 } = header; 
    const canvas = document.createElement('canvas'); canvas.width = 2048; canvas.height = 1024; const ctx = canvas.getContext('2d'); 
    const spacing = 20, scaleX = canvas.width / nx, scaleY = canvas.height / ny; 

    ctx.lineWidth = 1.5; 
    for (let y = spacing/2; y < canvas.height; y += spacing) { 
        for (let x = spacing/2; x < canvas.width; x += spacing) { 
            const idx = Math.floor(y / scaleY) * nx + Math.floor(x / scaleX); 
            if (idx < uData.length) { 
                const u = uData[idx], v = vData[idx], speed = Math.sqrt(u*u + v*v); 
                if (speed > 2.0) { 
                    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(-v, u)); 
                    ctx.strokeStyle = speed > 15 ? '#ff453a' : (speed > 8 ? '#ffd60a' : '#ffffff'); 
                    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(2, -3); ctx.moveTo(6, 0); ctx.lineTo(2, 3); ctx.stroke(); ctx.restore(); 
                } 
            } 
        } 
    } 
    let w = lo1 > 180 ? lo1 - 360 : lo1, e = lo2 > 180 ? lo2 - 360 : lo2; if (e <= w) e += 360; 
    arrowTextureLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({ url: canvas.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la2, e, la1) })); 
} 

function renderPrecipitationTexture(jsonData) { 
    const { data, header } = jsonData, { nx, ny, lo1, la1, lo2, la2 } = header; 
    const canvas = document.createElement('canvas'); canvas.width = nx; canvas.height = ny; const ctx = canvas.getContext('2d'); const imgData = ctx.createImageData(nx, ny); 
    for (let i = 0; i < data.length; i++) { 
        const val = data[i]; 
        if (val > 0.2) { 
            const cIdx = i * 4; 
            if (val < 4) { imgData.data[cIdx+1] = 200; imgData.data[cIdx+3] = 130; } 
            else { imgData.data[cIdx] = 230; imgData.data[cIdx+1] = 50; imgData.data[cIdx+3] = 180; } 
        } 
    } 
    ctx.putImageData(imgData, 0, 0); 
    let w = lo1 > 180 ? lo1 - 360 : lo1, e = lo2 > 180 ? lo2 - 360 : lo2; if (e <= w) e += 360; 
    precipTextureLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({ url: canvas.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la2, e, la1) })); 
    enforceLayerOrdering(); 
} 

function renderIsobarContours(jsonData) { 
    const { data, header } = jsonData, { nx, ny, lo1, la1, dx, dy } = header; 
    const canvas = document.createElement('canvas'); canvas.width = 2048; canvas.height = 1024; const ctx = canvas.getContext('2d'); 
    ctx.lineWidth = 1.2; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; 

    for (let p = 97000; p <= 104000; p += 400) { 
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.font = '11px sans-serif'; 
        for (let y = 0; y < ny - 1; y++) { 
            for (let x = 0; x < nx - 1; x++) { 
                const i = y * nx + x; const pts = getCellIntersections(x, y, data[i], data[i+1], data[i+nx], data[i+nx+1], p); 
                if (pts.length >= 2) { 
                    const x1 = (pts[0].x / nx) * canvas.width, y1 = (pts[0].y / ny) * canvas.height; 
                    const x2 = (pts[1].x / nx) * canvas.width, y2 = (pts[1].y / ny) * canvas.height; 
                    if (x % 45 === 0 && y % 45 === 0) ctx.fillText(String(Math.round(p/100)), x1, y1); 
                    else { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); } 
                } 
            } 
        } 
    } 
    let w = lo1 > 180 ? lo1 - 360 : lo1, e = (lo1 + (nx * dx)) > 180 ? (lo1 + (nx * dx)) - 360 : (lo1 + (nx * dx)); if (e <= w) e += 360; 
    combinedOutputLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({ url: canvas.toDataURL(), rectangle: Cesium.Rectangle.fromDegrees(w, la1 - (ny * dy), e, la1) })); 
    enforceLayerOrdering(); 
} 

function getCellIntersections(x, y, vTL, vTR, vBL, vBR, iso) { 
    let pts = []; 
    if ((vTL >= iso) !== (vTR >= iso)) pts.push({ x: x + (iso - vTL) / (vTR - vTL), y }); 
    if ((vBL >= iso) !== (vBR >= iso)) pts.push({ x: x + (iso - vBL) / (vBR - vBL), y: y + 1 }); 
    if ((vTL >= iso) !== (vBL >= iso)) pts.push({ x, y: y + (iso - vTL) / (vBL - vTL) }); 
    if ((vTR >= iso) !== (vBR >= iso)) pts.push({ x: x + 1, y: y + (iso - vTR) / (vBR - vTR) }); 
    return pts; 
} 

// 3. Grid Coordinates Hover Inspector Event Handling
const mouseHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas); 
mouseHandler.setInputAction(function(movement) { 
    if (!activeDataset && !activePrecipDataset) { trackingLabel.style.display = 'none'; return; } 
    const cartesian = viewer.camera.pickEllipsoid(movement.endPosition, viewer.scene.globe.ellipsoid); 
    if (cartesian) { 
        const carto = Cesium.Cartographic.fromCartesian(cartesian); 
        let lon = Cesium.Math.toDegrees(carto.longitude), lat = Cesium.Math.toDegrees(carto.latitude); 
        const header = activeDataset ? activeDataset[0].header : activePrecipDataset.header; 
        
        if (lon < 0 && header.lo1 >= 0) lon += 360; 
        if (lon >= header.lo1 && lon <= header.lo2 && lat >= header.la2 && lat <= header.la1) { 
            const xIdx = Math.floor(((lon - header.lo1) / (header.lo2 - header.lo1)) * header.nx); 
            const yIdx = Math.floor(((header.la1 - lat) / (header.la1 - header.la2)) * header.ny); 
            const gridIdx = yIdx * header.nx + xIdx; 

            let html = `<strong>📍 Location Data</strong><br>Lat: ${lat.toFixed(2)}° | Lon: ${lon.toFixed(2)}°<br>`; 
            if (activeDataset && gridIdx < activeDataset[0].data.length) { 
                const u = activeDataset[0].data[gridIdx], v = activeDataset[1].data[gridIdx], speed = Math.sqrt(u*u + v*v); 
                html += `<hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:4px 0;"><strong>💨 Velocity Metrics</strong><br>Speed: ${(speed / 0.514444).toFixed(1)} knots (${speed.toFixed(1)} m/s)`; 
            } 
            if (activePrecipDataset && gridIdx < activePrecipDataset.data.length) { 
                html += `<hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:4px 0;"><strong>🌧️ Forecast Accumulation</strong><br>Rate: ${activePrecipDataset.data[gridIdx].toFixed(2)} mm/6hr`; 
            } 
            trackingLabel.style.display = 'block'; trackingLabel.style.left = (movement.endPosition.x + 15) + 'px'; trackingLabel.style.top = (movement.endPosition.y + 15) + 'px'; trackingLabel.innerHTML = html; return; 
        } 
    } 
    trackingLabel.style.display = 'none'; 
}, Cesium.ScreenSpaceEventType.MOUSE_MOVE); 

// Initial execution call parameters
changeBasemap('dark'); 
fetchWebGLWindCoastlines(); 
viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(125.0, 32.0, 5500000), orientation: { heading: Cesium.Math.toRadians(0.0), pitch: Cesium.Math.toRadians(-90.0) } }); 
</script> 
</body> 
</html>
